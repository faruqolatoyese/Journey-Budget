name: Journey Budget CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Build CLI
        run: npm run build

      - name: Run unit and integration tests
        run: npm test

      - name: Run Journey Budget Check (with PR Summary)
        run: npx tsx tests/ci-smoke.ts